name: Build Debug APK and Publish Release

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java installation
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == 1) print $2; else print $1}')
          echo "Detected active Java major version: $JAVA_MAJOR_VERSION"
          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "Error: Failed to detect Java version"
            exit 1
          fi
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version is $JAVA_MAJOR_VERSION, expected 17 or newer"
            exit 1
          fi
          echo "Java 17 or newer verified successfully."

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore missing. Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Built APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ] && [ -s "$APK_PATH" ] && [[ "$APK_PATH" == *.apk ]]; then
            echo "Expected APK verified: $APK_PATH"
          else
            echo "Error: Expected APK ($APK_PATH) is missing, empty, or invalid."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching in app/build/outputs/apk:"
              find app/build/outputs/apk -type f
            fi
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v gh &> /dev/null; then
            echo "Error: GitHub CLI (gh) is not available."
            exit 1
          fi
          echo "GitHub CLI is available."

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          gh release create "$TAG_NAME" "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest
